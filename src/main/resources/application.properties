spring.main.web-application-type=none

# File paths
dna.fasta-export-path=resources/dna_export.fasta
dna.state-file-path=resources/virus_state.vrs
dna.stats-file-path=resources/virology_stats.json

# DNA Splicing
dna.max-fragment-length=1000
dna.alignment-score-threshold=0.8

# Protein Folding
protein.max-amino-acids=500
protein.bond-energy-threshold=10.0
protein.approximation-ratio-tolerance=2.0

# Infection Dynamics
infection.max-cells=10000
infection.weight-default=1.0
infection.max-infected-clusters=100

# Simulation
simulation.step-delay-ms=100
simulation.event-queue-capacity=1000

# Visualization
visualization.max-timestamp=100000
visualization.display-complexity=true